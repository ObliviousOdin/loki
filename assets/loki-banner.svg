<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Loki</title>
  <desc id="desc">The forest-green Loki mark and wordmark on white, with the tagline "One agent. Every shape." Sage, ochre, brick-red and slate-blue geometric accents surround a terminal, chat thread and desktop window.</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#ffffff"/>
    <circle cx="1136" cy="104" r="70" fill="#d6a74b"/>
    <path d="M858 282h72v72h-72z" fill="#cedcc8"/>
    <path d="M1144 304h54v54h-54z" fill="#bf6252"/>
    <path d="M1214 246v72h-72a72 72 0 0 0 72-72z" fill="#667f91"/>

    <!-- Every shape: terminal, chat, window -->
    <g fill="none" stroke="#304b42" stroke-width="2" stroke-linejoin="round">
      <g>
        <rect x="944" y="62" width="244" height="150" rx="6" fill="#ffffff"/>
        <path d="M944 92H1188"/>
        <circle cx="964" cy="77" r="4"/>
        <circle cx="980" cy="77" r="4"/>
        <circle cx="996" cy="77" r="4"/>
        <path d="M968 124h120M968 148h168M968 172h96"/>
      </g>
      <g stroke="#667f91">
        <path d="M1032 190h168a12 12 0 0 1 12 12v84a12 12 0 0 1-12 12h-116l-28 26v-26h-24a12 12 0 0 1-12-12v-84a12 12 0 0 1 12-12z" fill="#ffffff"/>
        <path d="M1052 226h128M1052 254h88"/>
      </g>
      <g stroke="#3f7562">
        <rect x="872" y="168" width="208" height="132" rx="6" fill="#cedcc8"/>
        <path d="M896 214l20 18-20 18M928 250h40" stroke-width="5" stroke-linecap="square"/>
      </g>
    </g>

    <!-- Mark -->
    <path transform="translate(102.72 74.0) scale(0.04728)" fill="#3f7562"
          d="M 1000 550 L 2080 1290 L 2080 3690 L 4370 3690 L 4370 4780 L 1000 4780 Z M 3320 1290 L 4400 550 L 4400 2600 L 3320 2600 Z"/>

    <!-- Wordmark: L and I carry the mark's horn cuts -->
    <g transform="translate(380 116) scale(1.2)" fill="#304b42">
      <path d="M0 0L26 18V74H74V100H0Z"/>
      <path fill-rule="evenodd" d="M94 0H180V100H94ZM120 26V74H154V26Z"/>
      <path d="M200 0H226V36L254 0H288L250 50L288 100H254L226 64V100H200Z"/>
      <path d="M308 18L334 0V100H308Z"/>
    </g>

    <text x="379" y="298" fill="#304b42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="600" letter-spacing="-0.5">One agent. <tspan fill="#3f7562">Every shape.</tspan></text>
  </g>
</svg>
