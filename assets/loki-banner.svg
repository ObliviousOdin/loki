<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Loki</title>
  <desc id="desc">The Loki mark and wordmark on Loki Teal, with the tagline "One agent. Every shape." and outlines of a terminal, a chat thread and a desktop window.</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffe6cb" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="230" cy="200" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8f84" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2f8f84" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2f8f84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.55" stop-color="#041c1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#041c1c" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#041c1c"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- Every shape: terminal, chat, window -->
    <g fill="none" stroke="#ffe6cb" stroke-width="2" stroke-linejoin="round">
      <g stroke-opacity="0.32">
        <rect x="944" y="62" width="244" height="150" rx="12"/>
        <path d="M944 92H1188"/>
        <circle cx="964" cy="77" r="4"/>
        <circle cx="980" cy="77" r="4"/>
        <circle cx="996" cy="77" r="4"/>
        <path d="M968 124h120M968 148h168M968 172h96"/>
      </g>
      <g stroke-opacity="0.5">
        <path d="M1032 190h168a12 12 0 0 1 12 12v84a12 12 0 0 1-12 12h-116l-28 26v-26h-24a12 12 0 0 1-12-12v-84a12 12 0 0 1 12-12z"/>
        <path d="M1052 226h128M1052 254h88"/>
      </g>
      <g stroke="#ffbd38" stroke-opacity="0.9">
        <rect x="872" y="168" width="208" height="132" rx="12" fill="#041c1c"/>
        <path d="M896 214l20 18-20 18M928 250h40" stroke-width="5" stroke-linecap="square"/>
      </g>
    </g>
    <rect width="1280" height="400" fill="url(#fade)"/>

    <!-- Mark -->
    <path transform="translate(102.72 74.0) scale(0.04728)" fill="#ffe6cb"
          d="M 1000 550 L 2080 1290 L 2080 3690 L 4370 3690 L 4370 4780 L 1000 4780 Z M 3320 1290 L 4400 550 L 4400 2600 L 3320 2600 Z"/>

    <!-- Wordmark: L and I carry the mark's horn cuts -->
    <g transform="translate(380 116) scale(1.2)" fill="#ffe6cb">
      <path d="M0 0L26 18V74H74V100H0Z"/>
      <path fill-rule="evenodd" d="M94 0H180V100H94ZM120 26V74H154V26Z"/>
      <path d="M200 0H226V36L254 0H288L250 50L288 100H254L226 64V100H200Z"/>
      <path d="M308 18L334 0V100H308Z"/>
    </g>

    <text x="381" y="92" fill="#ffbd38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" letter-spacing="4">PERSONAL AI AGENT</text>
    <text x="379" y="298" fill="#ffe6cb" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.5">One agent. <tspan fill="#ffbd38">Every shape.</tspan></text>
  </g>
</svg>
