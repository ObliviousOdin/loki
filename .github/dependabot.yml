# Dependabot configuration for Loki.
#
# Retain the inherited github-actions configuration for reviewed updates.
# The zero version-PR limit below pauses scheduled update PRs. Dependency
# alerts remain enabled; maintainers review affected pins and update them
# through PM/lockfile tooling and a protected PR. Automatic security-fix
# PRs and automatic merges are not enabled by this configuration.
#
# Python/npm dependencies stay exactly pinned in their committed locks;
# GitHub Actions stay pinned to full commit SHAs. Do not change resolved
# environments directly or merge dependency upgrades without verification.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      # Group minor/patch version bumps if scheduled PRs are re-enabled.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
