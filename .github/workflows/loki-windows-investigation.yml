name: Loki Windows process investigation

on:
  push:
    branches: [codex/windows-investigation-c0]

permissions:
  contents: read

concurrency:
  group: loki-windows-investigation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native_observation:
    name: Windows process completion observation
    if: github.repository == 'ObliviousOdin/loki' && github.ref == 'refs/heads/codex/windows-investigation-c0'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "telegram"]'
          test-environment: 'true'
          cache-suffix: loki
          packages: ripgrep
          archive-inputs: 'false'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
          save-tools-cache: 'false'
          save-python-cache: 'false'
          save-node-cache: 'false'
      - name: Record actual Windows and source identity
        id: identity
        shell: bash
        env:
          LOKI_INVESTIGATION_COMMIT: ${{ github.sha }}
        run: |
          test "$RUNNER_OS" = Windows
          test "$(git rev-parse HEAD)" = "$LOKI_INVESTIGATION_COMMIT"
          python -c 'import platform, sys; assert sys.platform == "win32"; print(platform.platform(), platform.machine())'
      - name: Observe actual job cancellation and original process handles
        shell: bash
        run: |
          scripts/run_tests.sh tests/scripts/desktop_update/test_update_job_termination.py \
            -j 1 --file-timeout 180 --file-retries 0 -- \
            --junitxml "$RUNNER_TEMP/loki-process-observation.xml" -o junit_logging=all -rP
      - name: Retain bounded process observations in the job log
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / "loki-process-observation.xml"
          if not report.is_file() or report.stat().st_size > 1048576:
              raise SystemExit("Expected a bounded native test report")
          cases = list(ET.parse(report).iter("testcase"))
          if len(cases) != 2:
              raise SystemExit("Expected both native process lifetime cases")
          for case in cases:
              observations = [line for node in case.iter("system-out")
                              for line in (node.text or "").splitlines()
                              if line.startswith("WINDOWS_JOB_PROBE=")]
              if len(observations) != 1 or len(observations[0]) > 65536:
                  raise SystemExit("Expected one bounded observation per native case")
              print("WINDOWS_JOB_PROBE_TEST=" + case.attrib["name"])
              print("WINDOWS_JOB_PROBE=" + json.dumps(json.loads(observations[0].split("=", 1)[1]), sort_keys=True))
          PY
      - name: Verify native handoff completion, sharing and pipe drain
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          scripts/run_tests.sh \
            tests/scripts/desktop_update/test_handoff_fixture_log_sharing.py \
            tests/scripts/desktop_update/test_desktop_update_windows_commit_outcome.py \
            tests/scripts/desktop_update/test_desktop_update_windows_pipe_drain.py \
            -j 1 --file-timeout 600 --file-retries 0
