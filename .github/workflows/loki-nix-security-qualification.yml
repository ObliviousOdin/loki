                const inherited = process.env.npm_config_nodedir
                assert.equal(typeof inherited, 'string')
                assert.ok(inherited.startsWith('/nix/store/'))
                assert.equal(process.env.npm_package_config_node_gyp_nodedir, undefined)
                const argv = ['diagnostic-node', 'diagnostic-gyp', '--nodedir=/usr']
                const injected = createGyp()
                injected.parseArgv([...argv])
                assert.equal(injected.opts.nodedir, inherited)
                delete process.env.npm_config_nodedir
                const isolated = createGyp()
                isolated.parseArgv([...argv])
                assert.equal(isolated.opts.nodedir, '/usr')
                console.log(JSON.stringify({diagnostic:'actual-supplier-parseArgv',
                  node:process.version,execPath:process.execPath,
                  inheritedLegacy:inherited,preferredAbsent:true,
                  injectedResult:injected.opts.nodedir,isolatedResult:isolated.opts.nodedir}))
