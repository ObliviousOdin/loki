                echo '519f18a55044e1506e3046584c5d5bd972b81a080a911c9235f05174abe64ad4  test/test-install.js' | sha256sum --check
                echo '2811d147b003d85db09095eafc4975b8d188fb0c1fc049e50130861275adaeec  package.json' | sha256sum --check
                echo '33a902a4798211dc9c8b165fa3ae4edd16ac64203d441e27f3fd36c8117afda2  package-lock.json' | sha256sum --check
                sha256sum lib/node-gyp.js lib/configure.js lib/install.js \
