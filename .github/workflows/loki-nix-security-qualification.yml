              source_url = (SOURCE.as_uri().replace('file:', 'git+file:', 1)
                            + '?rev=' + EXPECTED + '&shallow=1')
              assert re.fullmatch(r'git\+file:///[A-Za-z0-9._~%/-]+\?rev='
                                  + EXPECTED + r'&shallow=1', source_url)
