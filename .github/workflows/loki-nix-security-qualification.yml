                  'admitted_locked_setuptools_version': metadata['admittedLockedSetuptoolsVersion'],
                  'runtime_setuptools_derivations': metadata['runtimeSetuptoolsDerivations'],
                  'derivation_inputs': {k: env.get(k) for k in
