              assert RECEIPT['free_bytes_before'] >= 8 * 1024**3, 'Need at least 8 GiB free'
              control = ROOT / 'controller-application-control.nix'
              with control.open('x') as stream:
                  stream.write('{ sourceUrl }: { applied = true; inputType = builtins.typeOf sourceUrl; inherit sourceUrl; }\n')
              checked, text = evaluate('controller-application-control', control.name, limit=30)
              assert checked['returncode'] == 0 and not checked['timed_out'], 'Nix controller application failed'
              expected_control = {
                  'applied': True, 'inputType': 'string',
                  'sourceUrl': SOURCE.as_uri().replace('file:', 'git+file:', 1)
                               + '?rev=' + EXPECTED + '&shallow=1',
              }
              assert json.loads(text) == expected_control, 'Unexpected Nix controller application result'
              RECEIPT['controller_application_control'] = expected_control
              admission, _ = evaluate('source-admission', 'admission-metadata.nix')
              assert admission['returncode'] == 0 and not admission['timed_out'], 'Source/API preparation failed'
              primary, text = evaluate('production-context', 'production-component-context.nix')
