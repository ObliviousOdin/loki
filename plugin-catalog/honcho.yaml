description: "Loki compatibility copy of the Honcho memory provider from Plastic Labs, with isolated Loki configuration and host/workspace/peer defaults. Preserves cross-session memory, semantic search, reasoning and persistent conclusions. Installation requires configured Git read access to the Loki repository and normal dependency consent. Use your own Honcho account/API key or self-hosted server; OAuth requires an application authorized for Loki. Disclosure — conversation turns, derived conclusions and peer/session identifiers are sent to your configured Honcho API (api.honcho.dev by default), and requests carry X-Honcho-Host (Loki version and OS) and X-Honcho-Plugin (compatibility plugin version) headers. The original MIT license and exact upstream provenance are retained in the plugin directory."
maintainer: ObliviousOdin
